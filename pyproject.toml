[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bouncebrdf"]

[project]
name = "bouncebrdf"
version = "1.0.0"
description = "High-gloss SVBRDF capture using bounce light"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colour-science>=0.4.7",
    "matplotlib>=3.10.9",
    "mitsuba==3.6.4",
    "numpy>=2.4.6",
    "openexr>=3.4.12",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "huggingface_hub>=0.27.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
cpu    = ["torch>=2.11.0"]
cu126  = ["torch>=2.11.0"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",    extra = "cpu" },
  { index = "pytorch-cu126",  extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
